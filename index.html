<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA FAST LIVE</title>

<style>

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:340px;
    background:#111;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 25px #00ff99;
}

h1{
    color:#00ff99;
    margin-bottom:20px;
}

#number{
    font-size:90px;
    font-weight:bold;
    color:#00ff99;
    transition:0.2s;
}

#issue{
    margin-top:15px;
    font-size:18px;
    color:#aaa;
}

#status{
    margin-top:10px;
    color:lime;
}

.flash{
    animation:flash 0.3s linear;
}

@keyframes flash{
    0%{transform:scale(1.3);color:yellow;}
    100%{transform:scale(1);}
}

</style>
</head>

<body>

<div class="box">

<h1>LIVE RESULT ⚡</h1>

<div id="number">--</div>

<div id="issue">Loading...</div>

<div id="status">FAST DETECTING...</div>

</div>

<script>

const API =
"https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json";

let lastIssue = "";

async function getData(){

    try{

        const response = await fetch(API + "?t=" + Date.now());

        const data = await response.json();

        const latest = data.data.list[0];

        const issue = latest.issueNumber;
        const number = latest.number;

        if(issue !== lastIssue){

            lastIssue = issue;

            document.getElementById("number").innerHTML = number;

            document.getElementById("issue").innerHTML =
            "Issue : " + issue;

            document.getElementById("number")
            .classList.add("flash");

            setTimeout(()=>{
                document.getElementById("number")
                .classList.remove("flash");
            },300);

            console.log("NEW RESULT :", number);

        }

    }catch(e){

        console.log("ERROR",e);

    }

}

getData();

setInterval(getData, 200);

</script>

</body>
</html>
